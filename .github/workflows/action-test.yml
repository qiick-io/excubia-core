name: Action test

# None of the jobs below is a required status check (branch protection requires only the six
# `PHP <version> <deps>` checks from ci.yml), so this workflow may be skipped by path filters
# outright: a skipped workflow never reports, and a required check that never reports leaves a
# pull request pending forever. If one of these ever becomes required, the `paths-ignore`
# filters have to go and the gate has to move into the jobs, as in ci.yml.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/assets/**
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/assets/**

permissions:
  contents: read

concurrency:
  # The event is part of the group: a push run and a pull-request run on the same SHA are
  # different evidence and must never cancel each other (externa-core#805).
  group: action-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A `main` or `develop` run is the release evidence: let it finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# Runs the composite action from this checkout. SARIF is never uploaded here,
# so the workflow needs no security-events permission and is safe on forks.
jobs:
  sarif:
    name: SARIF output (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the default php-version input; 8.2 is the package floor and
        # proves the locked action dependencies install there.
        php:
          - '8.2'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Excubia action
        id: excubia
        uses: ./
        with:
          path: tests/Fixtures/Projects/outdated-laravel-10
          fail-on: none
          upload-sarif: 'false'
          github-token: ${{ github.token }}
          php-version: ${{ matrix.php }}

      - name: Assert SARIF is valid
        env:
          SARIF_FILE: ${{ steps.excubia.outputs.sarif-file }}
        run: |
          test -s "$SARIF_FILE"
          jq -e '.version == "2.1.0"' "$SARIF_FILE"
          jq -e '.runs[0].results | length > 0' "$SARIF_FILE"

  fail-on:
    name: Exit code follows fail-on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Excubia action
        id: excubia
        continue-on-error: true
        uses: ./
        with:
          path: tests/Fixtures/Projects/outdated-laravel-10
          fail-on: critical
          upload-sarif: 'false'
          github-token: ${{ github.token }}

      - name: Assert the action failed with exit code 1
        env:
          OUTCOME: ${{ steps.excubia.outcome }}
          EXIT_CODE: ${{ steps.excubia.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
