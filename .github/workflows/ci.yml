name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        dependency-version:
          - lowest
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest
          else
            composer update --no-interaction --prefer-dist
          fi

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan

      - name: Pest
        run: vendor/bin/pest --parallel --coverage --coverage-clover=build/clover.xml

      - name: Coverage gate
        run: php .github/assert-coverage.php build/clover.xml src/Checks=90 src=90

      - name: Dogfood
        run: php bin/excubia check --fail-on=critical --no-banner

  laravel:
    name: Laravel ${{ matrix.laravel }} PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        laravel:
          - '12'
          - '13'
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev --no-interaction --no-update "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (Laravel integration)
        run: vendor/bin/pest tests/Laravel

  # The qiick standards pack (agent files, architecture test) must match app-ui.
  standards:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@develop
    with:
      standards: true
      registry: false
